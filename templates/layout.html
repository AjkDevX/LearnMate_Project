<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}LearnMate — AI Academic Coach{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
  <!-- Highlight.js (Atom One Dark theme) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  {% block head_extra %}{% endblock %}
</head>
<body>

  <!-- ── Navigation ──────────────────────────────────────────────── -->
  <header class="navbar">
    <div class="navbar-inner">
      <a href="{{ url_for('index') }}" class="navbar-brand">
        <span class="brand-icon">🎓</span>
        <span class="brand-name">LearnMate</span>
        <span class="brand-badge">AI</span>
        <span class="brand-edition">MITAOE Edition</span>
      </a>
      <nav class="navbar-links" id="navLinks">
        <a href="{{ url_for('index') }}"   class="nav-link {% if request.endpoint == 'index'   %}active{% endif %}">Home</a>
        <a href="{{ url_for('chat') }}"    class="nav-link {% if request.endpoint == 'chat'    %}active{% endif %}">AI Coach</a>
        <a href="{{ url_for('pathway') }}" class="nav-link {% if request.endpoint == 'pathway' %}active{% endif %}">Pathway</a>
        <a href="{{ url_for('goals') }}"   class="nav-link {% if request.endpoint == 'goals'   %}active{% endif %}">Goals</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ── Main content ─────────────────────────────────────────────── -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ───────────────────────────────────────────────────── -->
  <footer class="site-footer">
    <p>
      Powered by <strong>IBM Watsonx.ai</strong> &amp; <strong>Granite</strong> &mdash;
      Built with ❤️ using Python Flask &bull; <span class="footer-edition">MITAOE Edition</span> &bull; &copy; 2024 LearnMate
    </p>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
